<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#070a12" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#020408" stop-opacity="1"/>
    </linearGradient>
    <radialGradient id="glowLight" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#ffb020" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flare" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="cinematicGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="675" fill="#05070c"/>
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  
  <!-- Volumetric Lighting & Atmospheric Glow -->
  <circle cx="600" cy="297" r="337" fill="url(#glowLight)"/>

  <!-- Anamorphic Lens Flare Line -->
  <ellipse cx="600" cy="337" rx="540.0" ry="3" fill="url(#flare)" filter="url(#cinematicGlow)"/>

  <!-- Grid Perspective Lines for Depth -->
  <g stroke="#00e5ff" stroke-opacity="0.12" stroke-width="1.5">
    <line x1="0" y1="675" x2="600" y2="367"/>
    <line x1="1200" y1="675" x2="600" y2="367"/>
    <line x1="240.0" y1="675" x2="600" y2="367"/>
    <line x1="960.0" y1="675" x2="600" y2="367"/>
    <line x1="480.0" y1="675" x2="600" y2="367"/>
    <line x1="720.0" y1="675" x2="600" y2="367"/>
  </g>

  <!-- Cinema Letterbox Frames -->
  <rect x="0" y="0" width="1200" height="40" fill="#000000"/>
  <rect x="0" y="634" width="1200" height="40" fill="#000000"/>

  <!-- Badges and Technical Watermarks -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <!-- Top Left Badge -->
    <rect x="25" y="16" width="220" height="26" rx="4" fill="#000" fill-opacity="0.8" stroke="#00e5ff" stroke-width="1"/>
    <text x="35" y="33" fill="#00e5ff" font-size="11" font-weight="900" letter-spacing="1">🎬 GEMINI 3 PRO 35MM</text>
    
    <!-- Top Right Aspect Badge -->
    <rect x="1060" y="16" width="115" height="26" rx="4" fill="#000" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
    <text x="1070" y="33" fill="#94a3b8" font-size="11" font-weight="800">RATIO: 16:9</text>

    <!-- Center Cinematic Title -->
    <text x="600" y="317" fill="#ffffff" font-size="28" font-weight="900" text-anchor="middle" letter-spacing="3" filter="url(#cinematicGlow)">CINEMATIC KEYFRAME</text>
    
    <!-- Subtitle / Action Context -->
    <text x="600" y="357" fill="#00e5ff" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1.5">35MM ANAMORPHIC • 8K RESOLUTION</text>

    <!-- Bottom Technical Metadata Bar -->
    <text x="30" y="657" fill="#64748b" font-size="10" font-weight="600" letter-spacing="0.5">LENS: 35MM ANAMORPHIC T1.8 | KODAK VISION3 500T | HDR10+ | GEMINI 3 PRO DIRECT VISION</text>
  </g>
</svg>