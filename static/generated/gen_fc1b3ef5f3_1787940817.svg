<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb020" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#070a12" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#020408" stop-opacity="1"/>
    </linearGradient>
    <radialGradient id="glowLight" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffb020" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#ff5500" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flare" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ffb020" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffb020" stop-opacity="0"/>
    </linearGradient>
    <filter id="cinematicGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="800" fill="#05070c"/>
  <rect width="800" height="800" fill="url(#bgGrad)"/>
  
  <!-- Volumetric Lighting & Atmospheric Glow -->
  <circle cx="400" cy="360" r="400" fill="url(#glowLight)"/>

  <!-- Anamorphic Lens Flare Line -->
  <ellipse cx="400" cy="400" rx="360.0" ry="3" fill="url(#flare)" filter="url(#cinematicGlow)"/>

  <!-- Grid Perspective Lines for Depth -->
  <g stroke="#ffb020" stroke-opacity="0.12" stroke-width="1.5">
    <line x1="0" y1="800" x2="400" y2="430"/>
    <line x1="800" y1="800" x2="400" y2="430"/>
    <line x1="160.0" y1="800" x2="400" y2="430"/>
    <line x1="640.0" y1="800" x2="400" y2="430"/>
    <line x1="320.0" y1="800" x2="400" y2="430"/>
    <line x1="480.0" y1="800" x2="400" y2="430"/>
  </g>

  <!-- Cinema Letterbox Frames -->
  <rect x="0" y="0" width="800" height="48" fill="#000000"/>
  <rect x="0" y="752" width="800" height="48" fill="#000000"/>

  <!-- Badges and Technical Watermarks -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <!-- Top Left Badge -->
    <rect x="25" y="16" width="220" height="26" rx="4" fill="#000" fill-opacity="0.8" stroke="#ffb020" stroke-width="1"/>
    <text x="35" y="33" fill="#ffb020" font-size="11" font-weight="900" letter-spacing="1">🎬 GEMINI 3 PRO 35MM</text>
    
    <!-- Top Right Aspect Badge -->
    <rect x="660" y="16" width="115" height="26" rx="4" fill="#000" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
    <text x="670" y="33" fill="#94a3b8" font-size="11" font-weight="800">RATIO: 1:1</text>

    <!-- Center Cinematic Title -->
    <text x="400" y="380" fill="#ffffff" font-size="28" font-weight="900" text-anchor="middle" letter-spacing="3" filter="url(#cinematicGlow)">KAELEN VANCE</text>
    
    <!-- Subtitle / Action Context -->
    <text x="400" y="420" fill="#ffb020" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1.5">35MM MASTER ANAMORPHIC • 8K RESOLUTION</text>

    <!-- Bottom Technical Metadata Bar -->
    <text x="30" y="782" fill="#64748b" font-size="10" font-weight="600" letter-spacing="0.5">LENS: 35MM ANAMORPHIC T1.8 | KODAK VISION3 500T | HDR10+ | GEMINI 3 PRO DIRECT VISION</text>
  </g>
</svg>