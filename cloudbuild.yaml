steps:
  # 1. Build Docker container image in Google Cloud
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/agentic-cinema:latest', '.']

  # 2. Push container image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/agentic-cinema:latest']

  # 3. Deploy to Google Cloud Run (Serverless Container Platform)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'agentic-cinema'
      - '--image=gcr.io/$PROJECT_ID/agentic-cinema:latest'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--set-env-vars=USE_VERTEX_AI=true,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GCS_BUCKET_NAME=agentic-cinema-projects'

images:
  - 'gcr.io/$PROJECT_ID/agentic-cinema:latest'
